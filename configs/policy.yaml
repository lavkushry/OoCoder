# Safety rails for the DE OSS contribution campaign (target: 100 PRs = first 50 + next 50).

labels:
  - "good first issue"
  - "good-first-issue"
  - "help wanted"
  - "help-wanted"
  - "documentation"
  - "kind:documentation"
  - "type:docs"
  - "docs"
  - "bug"
  - "kind:bug"
  - "type:bug"

quality:
  maxFilesChanged: 20
  maxLinesChanged: 400

rateLimits:
  # Continuous wave toward 100; tighten again after the campaign.
  maxIssuesPerDay: 120
  maxPrsPerDay: 100
  maxCommentsPerDay: 80

budget:
  maxUsdPerRun: 5.0

# Discuss disclosure left empty — PR bodies also have no agent footer.
disclosure: ""

prFooter: ""

ciFix:
  enabled: true
  maxAttemptsPerPr: 2
  maxFixesPerRun: 2
  minMinutesAfterPush: 10
  maxFilesTouched: 5
  maxLogBytes: 60000

telemetry:
  enabled: true

dashboard:
  refreshPrStates: true
  historyDays: 30

campaign:
  targetPrs: 100
  batchSize: 10
  discoverMultiplier: 5
  scrubBranding: true
