# Safety rails for the DE OSS contribution campaign (target: 50 PRs).

labels:
  - "good first issue"
  - "good-first-issue"
  - "help wanted"
  - "help-wanted"
  - "documentation"
  - "kind:documentation"
  - "type:docs"
  - "docs"
  - "bug"
  - "kind:bug"
  - "type:bug"

quality:
  maxFilesChanged: 20
  maxLinesChanged: 400

rateLimits:
  # Campaign pace — still bounded; raise further only if maintainers stay happy.
  maxIssuesPerDay: 25
  maxPrsPerDay: 15
  maxCommentsPerDay: 20

budget:
  maxUsdPerRun: 5.0

# Discuss disclosure left empty — PR bodies also have no agent footer.
disclosure: ""

prFooter: ""

ciFix:
  enabled: true
  maxAttemptsPerPr: 2
  maxFixesPerRun: 2
  minMinutesAfterPush: 10
  maxFilesTouched: 5
  maxLogBytes: 60000

telemetry:
  enabled: true

dashboard:
  refreshPrStates: true
  historyDays: 30
