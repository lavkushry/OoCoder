[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-agent"
version = "0.1.0"
description = "Self-hosted autonomous open-source contribution agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "oss-agent contributors" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
  "coverage>=7.5",
]

[project.scripts]
oss-agent = "oss_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/oss_agent" = "oss_agent"

[tool.hatch.build.targets.sdist]
include = ["src/oss_agent", "prompts", "fixtures", "docs/PRD_AND_DESIGN.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["oss_agent"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["oss_agent"]
branch = true
